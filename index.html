<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apk Qo’riqchi</title>
 <link rel="manifest" href="/manifest.webmanifest">
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<style>
:root{
  --u:min(1vw,4.8px); /* 1% of screen width, capped at the 480px frame */
  --bg:#101010; --text:#fff; --muted:#b9b4b8;
  --orange:#ff8a2b; --green:#2fd35f; --red:#ff3d5e; --amber:#ff9f0a;
  --font:"Roboto","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:var(--font)}
body{display:flex;justify-content:center}
.app{
  width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(120% 60% at 50% 20%,#2b1a0c 0%,#171210 55%,var(--bg) 100%);
}
header{display:flex;justify-content:space-between;align-items:center;height:calc(var(--u)*14);padding:0 calc(var(--u)*4);background:var(--bg)}
h1{margin:0;font-size:calc(var(--u)*6.7);font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--orange)}
.gear{width:calc(var(--u)*4.8);height:calc(var(--u)*4.8);fill:#9a9a9f;background:none;border:0;padding:0;cursor:pointer}
.gear svg{width:100%;height:100%}
main{flex:1;padding:calc(var(--u)*3.3) calc(var(--u)*6) calc(var(--u)*26)}
.ring{
  width:calc(var(--u)*62.5);aspect-ratio:1;margin:0 auto calc(var(--u)*3.3);
  border-radius:50%;padding:calc(var(--u)*1.2);
  background:conic-gradient(from 200deg,#b6f55a,#3ddc6c 40%,#12e070 70%,#2c8f4a 90%,#b6f55a);
}
.ring-in{
  width:100%;height:100%;border-radius:50%;border:calc(var(--u)*1.3) solid #2a1e17;
  background:radial-gradient(circle,#0f4a35 0%,#0b2e22 55%,#08241a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-in svg{width:calc(var(--u)*9.5);height:auto;margin-bottom:calc(var(--u)*2.2)}
.ring-in .label{font-size:calc(var(--u)*4.3);font-weight:500}
.ring-in .pct{font-size:calc(var(--u)*8.4);font-weight:700;color:#18e56f;line-height:1.15}
.card{
  border:calc(var(--u)*.3) solid #3a3533;border-radius:calc(var(--u)*8.3);
  background:linear-gradient(180deg,#2a211f,#1c1a1a);padding:calc(var(--u)*4.6) calc(var(--u)*4.7);
}
.status{display:flex;align-items:center;gap:calc(var(--u)*4)}
.badge{width:calc(var(--u)*11.6);aspect-ratio:1;border-radius:50%;background:#1f3a28;display:grid;place-items:center;flex:none}
.badge svg{width:42%}
.status h2{margin:0;font-size:calc(var(--u)*4.1);font-weight:700}
.status p{margin:0;color:var(--green);font-weight:600;font-size:calc(var(--u)*3.2);display:flex;align-items:center;gap:calc(var(--u)*.9)}
.dot{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);border-radius:50%;background:var(--green)}
.score{margin-top:calc(var(--u)*5)}
.score small{display:block;color:var(--muted);font-size:calc(var(--u)*3.2);letter-spacing:.02em}
.score strong{display:block;color:var(--green);font-size:calc(var(--u)*5.8);line-height:1.1}
.score span{color:var(--muted);font-size:calc(var(--u)*3.2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*2.5);margin-top:calc(var(--u)*5.5)}
.stat{
  border-radius:calc(var(--u)*5);height:calc(var(--u)*28.7);text-align:center;border:calc(var(--u)*.2) solid;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.stat svg{width:calc(var(--u)*4.2);height:auto}
.stat b{font-size:calc(var(--u)*5.4);line-height:1.3}
.stat span{font-size:calc(var(--u)*2.5);color:#d8d3d6;letter-spacing:.03em;margin-top:calc(var(--u)*1)}
.stat.d{background:#2c1c20;border-color:#5a2a35}.stat.d b{color:var(--red)}
.stat.s{background:#2d2318;border-color:#5a4220}.stat.s b{color:var(--amber)}
.stat.g{background:#17301f;border-color:#1f5a33}.stat.g b{color:var(--green)}
nav{
  position:fixed;bottom:0;width:100%;max-width:480px;background:#1f1f20;
  border-radius:calc(var(--u)*5.5) calc(var(--u)*5.5) 0 0;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:start;
  padding:calc(var(--u)*2.8) 0 calc(var(--u)*1.5);padding-bottom:calc(var(--u)*1.5 + env(safe-area-inset-bottom,0px));
}
nav button{background:none;border:0;color:#c9c5cc;font:inherit;font-size:calc(var(--u)*3);display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:0}
nav .ic{height:calc(var(--u)*12.7);display:grid;place-items:center}
nav .ic svg{width:calc(var(--u)*3.9);height:calc(var(--u)*3.9);fill:#c9c5cc}
nav .scan{color:var(--orange);font-weight:600}
nav .scan .ic{width:calc(var(--u)*12.7);border-radius:50%;background:var(--orange);margin-bottom:calc(var(--u)*1.5)}
nav .scan .ic svg{width:calc(var(--u)*5.2);height:auto}
nav button:focus-visible,.gear:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:12px}
.scanning .ring{animation:spin 1.2s linear infinite}
.scanning .ring-in{animation:spin 1.2s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.scanning .ring,.scanning .ring-in{animation:none}}
@media (min-width:520px){
  .app{margin:24px 0;min-height:calc(100vh - 48px);border-radius:36px;overflow:hidden;border:1px solid #2a2a2a}
  nav{position:absolute;max-width:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Apk <span>Qo’riqchi</span></h1>
    <button class="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.400 13a7.500 7.500 0 0 0 0-2l2.100-1.600a.5.5 0 0 0 .1-.6l-2-3.500a.5.5 0 0 0-.6-.2l-2.500 1a7.300 7.300 0 0 0-1.700-1l-.4-2.600a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.600c-.6.2-1.200.6-1.700 1l-2.500-1a.5.5 0 0 0-.6.2l-2 3.500a.5.5 0 0 0 .1.6L4.600 11a7.500 7.500 0 0 0 0 2l-2.100 1.600a.5.5 0 0 0-.1.6l2 3.500c.1.2.4.3.6.2l2.500-1c.5.4 1.100.8 1.700 1l.4 2.600c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.600c.6-.2 1.200-.6 1.700-1l2.500 1c.2.1.5 0 .6-.2l2-3.500a.5.5 0 0 0-.1-.6L19.400 13zM12 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg></button>
  </header>

  <main>
    <div class="ring"><div class="ring-in">
      <svg viewBox="0 0 24 28"><path d="M12 1 2 5v8h10zM12 13h10c0 6-4.200 11-10 13z" fill="#ffa631"/><path d="M12 1l10 4v8H12zM2 13h10v13C6.200 24 2 19 2 13z" fill="#ffa631" opacity=".0"/><path d="M12 1l10 4v8H12z" fill="#ffa631"/><path d="M2 13h10v13C6.200 24 2 19 2 13z" fill="#ffa631"/></svg>
      <div class="label">Security Analysis</div>
      <div class="pct" id="pct">100%</div>
    </div></div>

    <section class="card">
      <div class="status">
        <div class="badge"><svg viewBox="0 0 24 28"><path d="M12 1 2 5v8c0 6 4.200 11 10 13 5.800-2 10-7 10-13V5z" fill="#2fd35f"/></svg></div>
        <div><h2>Device Security Status</h2><p><i class="dot"></i><span id="state">All clear</span></p></div>
      </div>
      <div class="score">
        <small>Security Score</small>
        <strong>100% Safe</strong>
        <span>109 monitored app(s)</span>
      </div>
      <div class="stats">
        <div class="stat d"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#ff3d5e"/><rect x="10.800" y="5.500" width="2.400" height="8" rx="1.200" fill="#fff"/><circle cx="12" cy="17.500" r="1.400" fill="#fff"/></svg><b>0</b><span>Dangerous</span></div>
        <div class="stat s"><svg viewBox="0 0 24 24"><path d="M12 2 .5 21.500h23z" fill="#ff9f0a"/><rect x="11" y="9" width="2" height="6.500" fill="#2d2318"/><circle cx="12" cy="18" r="1.200" fill="#2d2318"/></svg><b>0</b><span>Suspicious</span></div>
        <div class="stat g"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2fd35f"/><path d="m6.500 12.500 4 4 7-8" fill="none" stroke="#0f2a18" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg><b>109</b><span>Safe</span></div>
      </div>
    </section>
  </main>

  <nav>
    <button><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 3h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 10h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 17h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4z"/></svg></span>Apps</button>
    <button class="scan" id="scan" aria-label="Scan"><span class="ic"><svg viewBox="0 0 24 28"><path d="M12 1 2 5v8h10zM12 13h10c0 6-4.200 11-10 13z" fill="#fff"/><path d="M12 1l10 4v8H12zM2 13h10v13C6.200 24 2 19 2 13z" fill="none" stroke="#fff" stroke-width="2"/></svg></span>Scan</button>
    <button><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 4h18v4H3zm0 6h18v4H3zm0 6h18v4H3z"/></svg></span>Memory check</button>
  </nav>
</div>

<script>
const app=document.getElementById('app'),pct=document.getElementById('pct'),state=document.getElementById('state');
document.getElementById('scan').addEventListener('click',()=>{
  if(app.classList.contains('scanning'))return;
  app.classList.add('scanning');state.textContent='Scanning…';
  let p=0;const t=setInterval(()=>{
    p+=4;pct.textContent=Math.min(p,100)+'%';
    if(p>=100){clearInterval(t);app.classList.remove('scanning');state.textContent='All clear'}
  },60);
});
</script>
</body>
</html>
