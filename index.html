<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apk Qo’riqchi</title>
 <link rel="manifest" href="/manifest.webmanifest">
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<style>
:root{
  --bg:#101010; --panel:#1e1b1a; --text:#ffffff; --muted:#b9b4b8;
  --orange:#ff8a2b; --green:#2fd35f; --red:#ff3d5e; --amber:#ff9f0a;
  --font:"Roboto","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:var(--font)}
body{display:flex;justify-content:center}
.app{
  width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 20%,#2b1a0c 0%,#171210 55%,var(--bg) 100%);
  position:relative;
}
header{display:flex;justify-content:space-between;align-items:center;padding:clamp(14px,4vw,20px) clamp(16px,4vw,22px);background:var(--bg)}
h1{margin:0;font-size:clamp(28px,8.5vw,40px);font-weight:700;letter-spacing:-.5px}
h1 span{color:var(--orange)}
.gear{width:32px;height:32px;fill:#9a9a9f;background:none;border:0;padding:0;cursor:pointer}
main{flex:1;padding:clamp(16px,4vw,26px) clamp(14px,4vw,22px) 110px}
.ring{
  width:min(62%,300px);aspect-ratio:1;margin:clamp(10px,3vw,24px) auto clamp(20px,5vw,34px);
  border-radius:50%;padding:clamp(7px,2vw,12px);
  background:conic-gradient(from 200deg,#b6f55a,#3ddc6c 40%,#12e070 70%,#2c8f4a 90%,#b6f55a);
  box-shadow:0 0 40px rgba(46,214,100,.15);
}
.ring-in{
  width:100%;height:100%;border-radius:50%;border:5px solid #2a1e17;
  background:radial-gradient(circle,#0f4a35 0%,#0b2e22 55%,#08241a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;
}
.ring-in svg{width:19%;height:auto}
.ring-in .label{font-size:clamp(18px,5.4vw,26px);font-weight:500;margin-top:4%}
.ring-in .pct{font-size:clamp(44px,13.5vw,68px);font-weight:700;color:#18e56f;line-height:1}
.card{
  border:2px solid #3a3533;border-radius:clamp(28px,8vw,44px);
  background:linear-gradient(180deg,#2a211f,#1c1a1a);padding:clamp(18px,5vw,26px);
}
.status{display:flex;align-items:center;gap:clamp(14px,4vw,26px)}
.badge{width:clamp(56px,15vw,72px);aspect-ratio:1;border-radius:50%;background:#1f3a28;display:grid;place-items:center;flex:none}
.badge svg{width:42%}
.status h2{margin:0;font-size:clamp(21px,5.8vw,28px);font-weight:700}
.status p{margin:4px 0 0;color:var(--green);font-weight:600;font-size:clamp(17px,4.6vw,21px);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.score{margin-top:clamp(22px,6vw,34px)}
.score small{display:block;color:var(--muted);font-size:clamp(17px,4.6vw,21px);letter-spacing:.3px}
.score strong{display:block;color:var(--green);font-size:clamp(38px,11vw,54px);line-height:1.1}
.score span{color:var(--muted);font-size:clamp(17px,4.6vw,21px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.6vw,14px);margin-top:clamp(20px,5.5vw,30px)}
.stat{
  border-radius:clamp(20px,6vw,30px);padding:clamp(16px,4.5vw,24px) 4px;text-align:center;border:1.5px solid;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.stat svg{width:clamp(26px,7vw,34px);height:auto}
.stat b{font-size:clamp(34px,10vw,48px);line-height:1.1}
.stat span{font-size:clamp(14px,3.9vw,18px);color:#d8d3d6;letter-spacing:.3px}
.stat.d{background:#2c1c20;border-color:#5a2a35}.stat.d b{color:var(--red)}
.stat.s{background:#2d2318;border-color:#5a4220}.stat.s b{color:var(--amber)}
.stat.g{background:#17301f;border-color:#1f5a33}.stat.g b{color:var(--green)}
nav{
  position:fixed;bottom:0;width:100%;max-width:480px;background:#1f1f20;
  border-radius:34px 34px 0 0;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;
  padding:14px 8px calc(14px + env(safe-area-inset-bottom,0px));
}
nav button{background:none;border:0;color:#c9c5cc;font:inherit;font-size:clamp(17px,4.8vw,22px);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:6px}
nav svg{width:34px;height:34px;fill:#c9c5cc}
nav button:focus-visible,.gear:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:12px}
nav .scan{color:var(--orange);font-weight:600;margin-top:-44px}
nav .scan i{width:clamp(66px,19vw,86px);aspect-ratio:1;border-radius:50%;background:var(--orange);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,138,43,.35)}
nav .scan svg{fill:#fff;width:42%;height:auto}
.scanning .ring{animation:spin 1.2s linear infinite}
.scanning .ring-in{animation:spin 1.2s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.scanning .ring,.scanning .ring-in{animation:none}}
@media (min-width:520px){
  .app{margin:24px 0;min-height:calc(100vh - 48px);border-radius:36px;overflow:hidden;border:1px solid #2a2a2a}
  nav{position:absolute;max-width:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Apk <span>Qo’riqchi</span></h1>
    <button class="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6c-.6.2-1.2.6-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.8 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.2 1.200-.6 1.700-1l2.500 1c.2.1.5 0 .6-.2l2-3.500a.5.5 0 0 0-.1-.6L19.400 13zM12 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg></button>
  </header>

  <main>
    <div class="ring"><div class="ring-in">
      <svg viewBox="0 0 24 28"><path d="M12 1 2 5v8c0 6 4.200 11 10 13 5.800-2 10-7 10-13V5L12 1z" fill="#ffa631"/><path d="M12 1v25c-5.800-2-10-7-10-13h10V5L2 5z" fill="none"/><path d="M12 1 2 5v8h10zM12 13h10c0 6-4.200 11-10 13z" fill="#ffa631"/><path d="M12 1l10 4v8H12zM2 13h10v13C6.200 24 2 19 2 13z" fill="#0b2e22" opacity=".85"/></svg>
      <div class="label">Security Analysis</div>
      <div class="pct" id="pct">100%</div>
    </div></div>

    <section class="card">
      <div class="status">
        <div class="badge"><svg viewBox="0 0 24 28"><path d="M12 1 2 5v8c0 6 4.200 11 10 13 5.800-2 10-7 10-13V5z" fill="#2fd35f"/></svg></div>
        <div><h2>Device Security Status</h2><p><i class="dot"></i><span id="state">All clear</span></p></div>
      </div>
      <div class="score">
        <small>Security Score</small>
        <strong id="score">100% Safe</strong>
        <span><span id="count">42</span> monitored app(s)</span>
      </div>
      <div class="stats">
        <div class="stat d"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#ff3d5e"/><rect x="10.800" y="5.500" width="2.400" height="8" rx="1.200" fill="#fff"/><circle cx="12" cy="17.500" r="1.400" fill="#fff"/></svg><b>0</b><span>Dangerous</span></div>
        <div class="stat s"><svg viewBox="0 0 24 24"><path d="M12 2 .5 21.500h23z" fill="#ff9f0a"/><rect x="11" y="9" width="2" height="6.500" fill="#2d2318"/><circle cx="12" cy="18" r="1.200" fill="#2d2318"/></svg><b>0</b><span>Suspicious</span></div>
        <div class="stat g"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2fd35f"/><path d="m6.500 12.500 4 4 7-8" fill="none" stroke="#0f2a18" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="safe">109</b><span>Safe</span></div>
      </div>
    </section>
  </main>

  <nav>
    <button><svg viewBox="0 0 24 24"><path d="M3 3h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 10h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 17h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4z"/></svg>Apps</button>
    <button class="scan" id="scan" aria-label="Scan"><i><svg viewBox="0 0 24 28"><path d="M12 1 2 5v8h10zM12 13h10c0 6-4.200 11-10 13z" fill="#fff"/><path d="M12 1l10 4v8H12zM2 13h10v13C6.200 24 2 19 2 13z" fill="none" stroke="#fff" stroke-width="2"/></svg></i>Scan</button>
    <button><svg viewBox="0 0 24 24"><path d="M3 4h18v4H3zm0 6h18v4H3zm0 6h18v4H3z"/></svg>Memory check</button>
  </nav>
</div>

<script>
const app=document.getElementById('app'),pct=document.getElementById('pct'),
state=document.getElementById('state');
document.getElementById('scan').addEventListener('click',()=>{
  if(app.classList.contains('scanning'))return;
  app.classList.add('scanning');state.textContent='Scanning…';
  let p=0;const t=setInterval(()=>{
    p+=4;pct.textContent=Math.min(p,100)+'%';
    if(p>=100){clearInterval(t);app.classList.remove('scanning');state.textContent='All clear'}
  },60);
});
</script>
</body>
</html>
